<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c8f9a">
<script>
/* affiche à l'écran toute erreur JavaScript de la page (diagnostic sur téléphone, sans console) */
(function(){
  function show(m){try{var d=document.getElementById("mb-err");if(!d){d=document.createElement("div");d.id="mb-err";d.setAttribute("role","alert");d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#2a0b14;color:#ffd6e1;border:1px solid #ff6b9d;border-radius:12px;padding:10px 12px;font:13px/1.4 system-ui,-apple-system,sans-serif";(document.body||document.documentElement).appendChild(d);}d.textContent=m;}catch(e){}}
  window.__mbErr=show;
  window.addEventListener("error",function(e){
    var page=location.href.split("#")[0];
    if(e.filename&&e.filename.split("#")[0]!==page)return;          /* ignore les scripts tiers */
    if(e.message&&/ResizeObserver loop/.test(e.message))return;       /* avertissement bénin */
    show("Erreur JavaScript : "+(e.message||"inconnue")+(e.lineno?" (ligne "+e.lineno+")":""));
  });
})();
</script>
<noscript><style>.top,.app,.backdrop{display:none!important}html,body{height:auto!important;overflow:auto!important}
/* ---------- Affichage de secours sans JavaScript (aperçu iPhone / Quick Look) ---------- */
.nojs{max-width:760px;margin:0 auto;padding:16px 16px 40px;color:#eaf2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.nj-brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.nj-brand span{color:#4dd4ff}
.nj-warn{margin:10px 0 14px;padding:12px 14px;border-radius:12px;background:rgba(77,212,255,0.08);border:1px solid rgba(77,212,255,0.3);font-size:14px}
.nj-fig{margin:0 0 6px;border-radius:16px;overflow:hidden;border:1px solid rgba(140,180,255,0.14);background:#050811}
.nj-fig svg{display:block;width:100%;height:auto}
.nj-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 6px;font-size:12px;color:#8ea0bc}
.nojs h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8ea0bc;margin:22px 0 10px}
.nj-cat{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#121c2c;border:1px solid rgba(140,180,255,0.14);border-left:3px solid var(--c)}
.nj-cat h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;color:var(--c)}
.nj-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.nj-n{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8ea0bc}
.nj-cat ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.nj-cat li{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:baseline}
.nj-cat li b{font-weight:600}
.nj-meta{grid-column:1;font-size:12.5px;color:#8ea0bc}
.nj-acts{grid-column:2;grid-row:1/span 2;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.nj-acts i,.nj-actlist i{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(95,251,255,0.12);color:#bff8ff}
.nj-actlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nj-actlist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:#121c2c;border:1px solid rgba(140,180,255,0.14)}
.nj-actlist small{grid-column:2;color:#8ea0bc;font-size:12px}
</style></noscript>
<title>Constellation des acteurs MedBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Plan : trois colonnes (filtres + annuaire | scène 3D ou matrice | fiche). Les étages de la scène = type d'acteur, le cœur = les 10 actions. */
:root{
  color-scheme:dark;
  --bg:#070b14; --surface:rgba(18,28,44,0.72); --surface-solid:#121c2c; --stage:#070b14;
  --ink:#eaf2ff; --muted:#8ea0bc; --line:rgba(140,180,255,0.14); --line-strong:rgba(140,180,255,0.28);
  --accent:#4dd4ff; --accent-soft:rgba(77,212,255,0.12); --on-accent:#021018;
  --c-fond:#4dd4ff; --c-coll:#ffb562; --c-acad:#b57dff; --c-pole:#ff6b9d;
  --glow-fond:rgba(77,212,255,0.55); --glow-coll:rgba(255,181,98,0.55); --glow-acad:rgba(181,125,255,0.55); --glow-pole:rgba(255,107,157,0.55);
  --display:"Outfit",system-ui,"Segoe UI",sans-serif;
  --body:"Outfit",system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f6f8; --surface:#ffffff; --surface-solid:#ffffff; --stage:#f8fbfc; --ink:#0f1f2a; --muted:#5d7180; --line:#dbe4e9; --line-strong:#c4d1d9;
  --accent:#0c8f9a; --accent-soft:#dff3f4; --on-accent:#ffffff;
  --c-fond:#0c8f9a; --c-coll:#c97a0a; --c-acad:#5560cf; --c-pole:#cf4a69;
  --glow-fond:rgba(12,143,154,0.4); --glow-coll:rgba(201,122,10,0.4); --glow-acad:rgba(85,96,207,0.4); --glow-pole:rgba(207,74,105,0.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;display:flex;flex-direction:column;background-image:radial-gradient(ellipse at 20% 0%,rgba(77,212,255,0.08),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(181,125,255,0.07),transparent 55%);background-attachment:fixed}
:root[data-theme="light"] body{background-image:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;background:var(--surface);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
.top h1 span{background:linear-gradient(90deg,var(--c-fond),var(--c-acad));-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{margin:0;color:var(--muted);font-size:13px}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.04);padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;color:var(--muted);border-radius:9px;transition:all .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--c-fond),var(--c-acad));color:var(--on-accent);box-shadow:0 2px 12px rgba(77,212,255,0.3)}
.btn{border:1px solid var(--line);background:var(--surface-solid);border-radius:12px;padding:8px 14px;font-weight:500;transition:all .2s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn.primary{background:linear-gradient(135deg,var(--c-fond),var(--c-acad));border-color:transparent;color:var(--on-accent);box-shadow:0 4px 18px rgba(77,212,255,0.3)}
.count{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

.app{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 340px}
.rail,.panel{background:var(--surface-solid);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.rail{border-right:1px solid var(--line)}
.panel{border-left:1px solid var(--line)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,0.03);transition:all .2s}
#q:focus{outline:0;border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,0.03);border-radius:999px;padding:6px 12px;font-size:13px;transition:all .15s;cursor:pointer}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.chips [data-cat="fond"]{--c:var(--c-fond)}.chips [data-cat="coll"]{--c:var(--c-coll)}.chips [data-cat="acad"]{--c:var(--c-acad)}.chips [data-cat="pole"]{--c:var(--c-pole)}
.chips [data-terr]{--c:var(--accent)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.shape{width:10px;height:10px;flex:none;border:2px solid currentColor}
.shape.paca{border-radius:50%}
.shape.corse{transform:rotate(45deg) scale(.85)}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px}
.row:hover{background:var(--bg)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .meta{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.empty{color:var(--muted);padding:6px 8px}

.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 45%,#0e1a2e,#050811 75%);overflow:hidden}
:root[data-theme="light"] .stage{background:radial-gradient(ellipse at 50% 45%,var(--surface),var(--stage) 70%)}
.stage::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,0.3),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,0.25),transparent),radial-gradient(1px 1px at 85% 15%,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 15% 70%,rgba(255,255,255,0.25),transparent),radial-gradient(1px 1px at 55% 25%,rgba(255,255,255,0.35),transparent);background-size:400px 400px;opacity:0.7;pointer-events:none;animation:twinkle 8s ease-in-out infinite}
:root[data-theme="light"] .stage::before{display:none}
/* trames de balayage holographiques, par-dessus la scène, sans bloquer le toucher */
.stage::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(180deg,rgba(95,251,255,0.045) 0 1px,transparent 1px 3px),
             linear-gradient(180deg,transparent 0%,rgba(95,251,255,0.07) 50%,transparent 100%);
  background-size:100% 3px,100% 220px;background-repeat:repeat,no-repeat;
  animation:holoscan 6s linear infinite}
@keyframes holoscan{from{background-position:0 0,0 -220px}to{background-position:0 0,0 calc(100% + 220px)}}
@media (prefers-reduced-motion:reduce){.stage::after{animation:none;background-size:100% 3px,0 0}}
:root[data-theme="light"] .stage::after{display:none}
.stage .legend,.stage .hud,.stage #openpanel,.stage .matrix{z-index:2}
@keyframes twinkle{50%{opacity:0.4}}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.grabbing{cursor:grabbing}
#cv.pointing{cursor:pointer}
.hud{position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hud .btn{padding:6px 10px;font-size:13px}
.legend{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);pointer-events:none}
.legend div{display:flex;align-items:center;gap:8px}
.hint{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--muted);pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;max-width:260px;transform:translate(14px,14px);z-index:3}
#tip b{display:block;font-size:13px}
[hidden]{display:none!important}

.matrix{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;padding:16px}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
th,td{padding:0;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:-16px;background:var(--surface);z-index:2}
thead th:first-child{text-align:left;padding:10px 12px}
.colb{border:0;background:transparent;width:100%;padding:10px 4px;font-family:var(--mono);font-weight:600;font-size:12px;border-radius:6px}
.colb small{display:block;font-weight:500;color:var(--muted);font-size:10px}
.colb:hover,.colb[aria-current="true"]{background:var(--accent-soft)}
tbody th{text-align:left;font-weight:500}
tbody th .row{border-radius:0}
tr.cat th{padding:9px 12px;background:var(--bg);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
td{text-align:center;width:46px}
td i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:middle}
tr.on th,tr.on td{background:var(--accent-soft)}
td.oncol{background:var(--accent-soft)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}

.panel h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c,var(--muted))}
.sub{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:30px 1fr 22px;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:5px 6px;border-radius:8px;text-align:left}
.bar:hover{background:var(--bg)}
.bar code,.act code{font-family:var(--mono);font-size:12px;font-weight:600}
.bar .track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .v{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.act{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.act:hover{border-color:var(--accent)}
.act small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.contact{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;gap:8px;align-items:flex-start}
.contact div{flex:1;min-width:0;overflow-wrap:anywhere}
.contact b{display:block}
.contact span{display:block;color:var(--muted);font-size:13px}
.x{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--bg);color:var(--ink)}
form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
form input{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
form button{grid-column:1/-1}
.check{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:0;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.mails{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px;font-family:var(--mono);font-size:12px;resize:vertical}
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);padding:0;font-weight:500}

/* ---------- Mobile (≤900 px) : scène plein écran + tiroir filtres + feuille fiche ---------- */
@media (max-width:900px){
  html,body{height:100%;overflow:hidden}
  body{overscroll-behavior:none}
  .top{padding:8px 10px;gap:6px;flex-wrap:nowrap;position:sticky;top:0;z-index:5;align-items:center;min-height:52px}
  .top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top p{display:none}
  .brand{min-width:0;flex:1;margin-right:0}
  .seg{flex:none}
  .seg button{padding:6px 10px;font-size:12px}
  .btn{padding:6px 10px;font-size:12px}
  #mailbtn{white-space:nowrap}

  .app{display:block;position:relative;height:calc(100% - 52px)}
  .stage{position:absolute;top:0;right:0;bottom:0;left:0;height:auto}
  .hint{display:none}
  .hud{bottom:calc(10px + env(safe-area-inset-bottom));left:10px;gap:4px;flex-wrap:nowrap}
  .hud .btn{padding:0;font-size:13px;width:40px;height:40px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center}
  #spin{width:auto;padding:0 10px;font-size:12px}
  .legend{top:10px;left:10px;font-size:11px;background:rgba(10,16,28,0.7);padding:6px 10px;border-radius:10px;border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #tip{display:none!important}

  /* bouton Détails flottant pour rouvrir la fiche */
  #openpanel{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;padding:10px 14px;font-weight:600;border-radius:999px;background:var(--accent);color:var(--on-accent);border:0;box-shadow:0 4px 14px rgba(0,0,0,0.18);display:flex;align-items:center;gap:6px;font-size:13px}

  /* tiroir latéral : filtres + annuaire */
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);max-width:none;transform:translateX(-100%);transition:transform .3s cubic-bezier(.3,1.2,.4,1);z-index:10;overflow-y:auto;box-shadow:12px 0 32px rgba(0,0,0,0.25);padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-right:1px solid var(--line)}
  .rail.open{transform:translateX(0)}

  /* feuille remontante : fiche détaillée */
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:85vh;transform:translateY(100%);transition:transform .35s cubic-bezier(.3,1.25,.4,1);z-index:10;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:4px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,0.22);overflow-y:auto;overscroll-behavior:contain}
  .panel.open{transform:translateY(0)}
  .panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 10px;flex:none}

  /* backdrop pour fermer */
  .backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.3);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .backdrop.on{opacity:1;pointer-events:auto}

  /* matrice : rend la table scrollable horizontalement */
  .matrix{padding:10px}
  table{font-size:12px;min-width:620px}
  thead th{top:-10px}
  td{width:38px}

  /* fiche : contenu lisible au doigt */
  .panel h2{font-size:18px}
  .act,.contact,.row,.check,.bar{min-height:40px}
  .act{padding:10px 12px}
  .row{padding:9px 10px}
  form input{padding:10px 12px;font-size:16px}
  .mails{font-size:13px}
  #q{padding:12px 14px;font-size:16px}
  .chip{padding:7px 12px;font-size:13px}
}
@media (max-width:900px){
  /* à l'affichage desktop, on cache ces éléments mobiles */
  .mobnav{display:flex;gap:8px}
}
.mobnav{display:none}
.mobnav button{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.mobnav button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#openpanel{display:none}
@media (max-width:900px){#openpanel{display:flex}}
</style>
</head>
<body>
<noscript>

<script>
(function(){
"use strict";
const ACTIONS=[
 ["A1","Attractivité des métiers & structuration opérationnelle","M1–M48"],
 ["A2","Rayonnement de l'Innovation","M1–M48"],
 ["A3","Automatisation de la gestion des données","M1–M48"],
 ["A4","Catalogue commun de formations à l'Innovation","M2–M48"],
 ["A5","Service commun d'analyse des publications scientifiques","M1–M46"],
 ["A6","Intégration et transformation des Fablabs — SILEX","M1–M48"],
 ["A7","Soutien ciblé aux projets de recherche et d'Innovation","M1–M48"],
 ["A8","Complémentarité des expertises","M1–M48"],
 ["A9","Bourses des incubés et entrepreneurs en résidence","M1–M48"],
 ["A10","Développement expérimental (optionnel)","M1–M48"]
].map(function(a,i){return {i:i,id:a[0],name:a[1],per:a[2]};});
const CATS={
 fond:{label:"Fondateurs",pill:"Fondateurs",one:"Fondateur",y:-195,r:285},
 coll:{label:"Collectivités",pill:"Collectivités",one:"Collectivité",y:-90,r:345},
 acad:{label:"Partenaires académiques & santé",pill:"Partenaires",one:"Partenaire académique / santé",y:100,r:345},
 pole:{label:"Pôles & associations",pill:"Pôles & assos",one:"Pôle / association",y:205,r:285}
};
const TERR={paca:"Côte d'Azur / PACA",corse:"Corse",nat:"National"};
const ACTORS=[
 ["Université Côte d'Azur","fond","paca","Chef de file",[1,2,3,5,7]],
 ["Università di Corsica Pasquale Paoli","fond","corse","Fondateur",[1,4,6],"Università di Corsica"],
 ["INRIA","fond","paca","Fondateur",[7,9]],
 ["CNRS","fond","paca","Fondateur",[5]],
 ["INSERM","fond","paca","Fondateur",[7]],
 ["INRAE","fond","paca","Fondateur",[7]],
 ["IRD","fond","nat","Fondateur",[7]],
 ["Observatoire Côte d'Azur","fond","paca","Fondateur",[2]],
 ["SATT Sud-Est","fond","paca","Fondateur",[10]],
 ["Incubateur Provence Côte d'Azur (IPCA)","fond","paca","Incubateur fondateur",[8,9],"IPCA"],
 ["Inizià","fond","corse","Incubateur fondateur",[8,9]],
 ["INSERM Transfert","fond","nat","Fondateur",[7,10]],
 ["Collectivité de Corse","coll","corse","Partenaire institutionnel",[2,6]],
 ["Région Provence-Alpes-Côte d'Azur","coll","paca","Partenaire institutionnel",[2,10],"Région PACA"],
 ["Métropole Nice Côte d'Azur","coll","paca","Partenaire institutionnel",[2],"Métropole NCA"],
 ["Département des Alpes-Maritimes","coll","paca","Partenaire institutionnel",[2],"Dép. Alpes-Maritimes"],
 ["CA du Pays de Grasse","coll","paca","Partenaire institutionnel",[2]],
 ["CA de Sophia Antipolis","coll","paca","Partenaire institutionnel",[2]],
 ["CHU de Nice","acad","paca","Partenaire hospitalier",[7]],
 ["Centre Antoine Lacassagne","acad","paca","Partenaire santé",[7]],
 ["Sorbonne Université","acad","nat","Partenaire académique",[7]],
 ["Université de Toulon","acad","paca","Partenaire académique",[4,7]],
 ["Université Gustave Eiffel","acad","nat","Partenaire académique",[7],"Univ. Gustave Eiffel"],
 ["Université PSL","acad","nat","Partenaire académique",[7]],
 ["Eurecom","acad","paca","Partenaire académique",[7]],
 ["EDHEC Business School","acad","paca","Partenaire académique",[4],"EDHEC"],
 ["SKEMA Business School","acad","paca","Partenaire académique",[4],"SKEMA"],
 ["Eurobiomed","pole","paca","Pôle de compétitivité",[2,8]],
 ["Cosmetic Valley","pole","nat","Pôle de compétitivité",[2]],
 ["Capenergies","pole","paca","Pôle de compétitivité",[2]],
 ["Pôle Optitec","pole","paca","Pôle de compétitivité",[2]],
 ["Cancéropôle PACA","pole","paca","Pôle de compétitivité",[2,7]],
 ["Telecom Valley","pole","paca","Association professionnelle",[2]],
 ["Rising Sud","pole","paca","Association entreprises",[2,8]]
].map(function(a,i){return {i:i,name:a[0],cat:a[1],terr:a[2],role:a[3],acts:a[4].map(function(n){return n-1;}),short:a[5]||a[0]};});

/* ---------- état ---------- */
const hot=window.claude&&window.claude.hot;
const saved=(hot&&hot.data)||{};
const S={view:saved.view||"3d",sel:saved.sel||null,hover:null,cats:new Set(),terrs:new Set(),q:"",mode:"fiche",
         yaw:-0.6,pitch:-0.3,zoom:window.innerWidth<=900?0.86:1,spin:true,yawTo:null};
if(hot&&hot.snapshot)hot.snapshot(function(){return {view:S.view,sel:S.sel};});
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce)S.spin=false;

/* contacts et mailing : conservés dans ce navigateur uniquement */
const KEY="medboard-acteurs-crm";
let store={contacts:{},mailing:[]};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.contacts)store=p;if(!Array.isArray(store.mailing))store.mailing=[];}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

const $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function actorsOf(ai){return ACTORS.filter(function(a){return a.acts.indexOf(ai)>=0;});}
function matches(a){
  if(S.cats.size&&!S.cats.has(a.cat))return false;
  if(S.terrs.size&&!S.terrs.has(a.terr))return false;
  if(S.q){
    const hay=norm(a.name+" "+a.role+" "+CATS[a.cat].label+" "+TERR[a.terr]+" "+a.acts.map(function(i){return ACTIONS[i].id+" "+ACTIONS[i].name;}).join(" "));
    if(hay.indexOf(norm(S.q))<0)return false;
  }
  return true;
}

/* ---------- disposition 3D ---------- */
const TAU=Math.PI*2;
function actAngle(i){return i/ACTIONS.length*TAU-Math.PI/2;}
function wrap(d){while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
const nodes=[];
ACTIONS.forEach(function(a){const t=actAngle(a.i);nodes.push({kind:"action",ref:a,x:Math.cos(t)*125,y:0,z:Math.sin(t)*125,ang:t});});
Object.keys(CATS).forEach(function(ck){
  const grp=ACTORS.filter(function(a){return a.cat===ck;});
  const tgt=grp.map(function(a){
    let x=0,z=0;a.acts.forEach(function(i){x+=Math.cos(actAngle(i));z+=Math.sin(actAngle(i));});
    return (Math.abs(x)+Math.abs(z)<0.2)?actAngle(a.acts[0]):Math.atan2(z,x);
  });
  const ang=tgt.map(function(t,k){return t+k*0.001;});
  const minSep=TAU/grp.length*0.74;
  for(let it=0;it<400;it++){
    const ord=ang.map(function(_,k){return k;}).sort(function(p,q){return wrap(ang[p]-ang[q])>0?1:-1;});
    ord.sort(function(p,q){return ((ang[p]%TAU)+TAU)%TAU-((ang[q]%TAU)+TAU)%TAU;});
    for(let k=0;k<ord.length;k++){
      const p=ord[k],q=ord[(k+1)%ord.length];if(p===q)continue;
      let gap=((ang[q]-ang[p])%TAU+TAU)%TAU;
      if(gap<minSep){const push=(minSep-gap)/2*0.5;ang[p]-=push;ang[q]+=push;}
    }
    for(let k=0;k<ang.length;k++)ang[k]+=wrap(tgt[k]-ang[k])*0.015;
  }
  grp.forEach(function(a,k){const c=CATS[ck];nodes.push({kind:"actor",ref:a,x:Math.cos(ang[k])*c.r,y:c.y,z:Math.sin(ang[k])*c.r,ang:ang[k]});});
});
const actorNode={},actionNode={};
nodes.forEach(function(n){(n.kind==="actor"?actorNode:actionNode)[n.ref.i]=n;});

/* ---------- canvas ---------- */
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage"),tip=$("tip");
let W=0,H=0,DPR=1,col={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ["ink","muted","line","accent","stage","surface","surface-solid","c-fond","c-coll","c-acad","c-pole"].forEach(function(k){col[k]=cs.getPropertyValue("--"+k).trim();});
  if(!col.stage||col.stage==="")col.stage="#070b14";
  if(!col["surface-solid"])col["surface-solid"]=col.surface;
}
readColors();
try{const mq=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");if(mq){if(mq.addEventListener)mq.addEventListener("change",readColors);else if(mq.addListener)mq.addListener(readColors);}}catch(e){}
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
let DPRCAP=2;
function resize(){
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,DPRCAP);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener("resize",resize);window.addEventListener("orientationchange",function(){setTimeout(resize,200);});
resize();

const F=1000;
function project(x,y,z){
  const cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
  const x1=x*cy+z*sy,z1=-x*sy+z*cy;
  const y2=y*cp-z1*sp,z2=y*sp+z1*cp;
  const s=F/(F+z2),k=Math.min(W,H)/2/330*S.zoom;
  /* écran vertical : on décale chaque étage en hauteur pour séparer les orbites sans les déformer */
  const ratio=H/Math.max(1,W),spread=ratio>1.3?Math.min(1.1,(ratio-1)*0.9):0;
  return {x:W/2+x1*s*k,y:H/2+18+y2*s*k+y*spread*k,s:s*k,z:z2};
}
function isSel(n){return S.sel&&S.sel.kind===n.kind&&S.sel.i===n.ref.i;}
function focusNode(){
  if(S.hover)return S.hover;
  if(S.sel)return S.sel.kind==="actor"?actorNode[S.sel.i]:actionNode[S.sel.i];
  return null;
}
function linked(a,b){

/* ---- hologramme : horloge, scintillement, aberration chromatique ---- */

/* projecteur : socle lumineux + faisceau qui monte sous la constellation */
function drawProjector(){

  const base=[];for(let i=0;i<=N;i++){const t=i/N*TAU;base.push(project(Math.cos(t)*R,baseY,Math.sin(t)*R));}
  const top=[];for(let i=0;i<=N;i++){const t=i/N*TAU;top.push(project(Math.cos(t)*R*2.3,topY,Math.sin(t)*R*2.3));}

function ring(y,r,color,k){

    const tw=ctx.measureText(txt).width;
    ctx.font="700 10px 'JetBrains Mono', monospace";

/* ---------- interactions canvas ---------- */
let drag=null;

  const n=pick(p.x,p.y);S.hover=n;cv.classList.toggle("pointing",!!n);
  if(n){
    tip.hidden=false;tip.style.left=Math.min(p.x,W-270)+"px";tip.style.top=Math.min(p.y,H-70)+"px";
    tip.innerHTML=n.kind==="actor"
      ?"<b>"+esc(n.ref.name)+"</b>"+esc(n.ref.role)+" · "+n.ref.acts.map(function(i){return ACTIONS[i].id;}).join(" ")
      :"<b>"+n.ref.id+" · "+esc(n.ref.name)+"</b>"+actorsOf(n.ref.i).length+" acteurs · "+n.ref.per;
  }else tip.hidden=true;
});
cv.addEventListener("pointerup",function(e){
  const p=pos(e),was=drag;drag=null;cv.classList.remove("grabbing");
  if(was&&was.moved<=6){const n=pick(p.x,p.y);select(n?{kind:n.kind,i:n.ref.i}:null,false);}
});
cv.addEventListener("pointerleave",function(){if(!drag){S.hover=null;tip.hidden=true;}});
cv.addEventListener("wheel",function(e){e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1);},{passive:false});
function zoomBy(k){S.zoom=Math.max(0.6,Math.min(2.6,S.zoom*k));}

/* ---- gestes tactiles : pinch zoom + bloquer le tip au survol ---- */
const isTouch=matchMedia("(hover:none)").matches;
let pinch=null;
cv.addEventListener("touchstart",function(e){
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:S.zoom};
    drag=null;cv.classList.remove("grabbing");tip.hidden=true;
  }
},{passive:true});
cv.addEventListener("touchmove",function(e){
  if(pinch&&e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    S.zoom=Math.max(0.6,Math.min(2.6,pinch.z*(d/pinch.d)));
    e.preventDefault();
  }
},{passive:false});
cv.addEventListener("touchend",function(e){if(e.touches.length<2)pinch=null;});
/* pinch natif iOS */
let gestStart=1;
cv.addEventListener("gesturestart",function(e){e.preventDefault();gestStart=S.zoom;});
cv.addEventListener("gesturechange",function(e){e.preventDefault();S.zoom=Math.max(0.6,Math.min(2.6,gestStart*e.scale));});
cv.addEventListener("gestureend",function(e){e.preventDefault();});
$("zin").onclick=function(){zoomBy(1.2);};
$("zout").onclick=function(){zoomBy(1/1.2);};
$("reset").onclick=function(){S.zoom=window.innerWidth<=900?0.86:1;S.pitch=-0.3;S.yawTo=-0.6;};
$("spin").onclick=function(){S.spin=!S.spin;this.setAttribute("aria-pressed",S.spin);};
$("spin").setAttribute("aria-pressed",S.spin);

/* ---------- sélection ---------- */
function select(sel,turn){
  S.sel=sel;S.mode="fiche";
  if(sel&&turn!==false){const n=sel.kind==="actor"?actorNode[sel.i]:actionNode[sel.i];S.yawTo=n.ang+Math.PI/2;}
  renderAll();
  if(sel&&mobile())openSheet();
  if(sel)try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
}
function mobile(){return window.innerWidth<=900;}
function openSheet(){$("panel").classList.add("open");$("backdrop").classList.add("on");}
function closeSheet(){$("panel").classList.remove("open");$("backdrop").classList.remove("on");}
function openDrawer(){$("rail").classList.add("open");$("backdrop").classList.add("on");}
function closeDrawer(){$("rail").classList.remove("open");$("backdrop").classList.remove("on");}
function closeAll(){closeSheet();closeDrawer();}

/* ---------- filtres, annuaire ---------- */
function renderFilters(){
  $("fcat").innerHTML=Object.keys(CATS).map(function(k){
    const n=ACTORS.filter(function(a){return a.cat===k;}).length;
    return '<button type="button" class="chip" data-cat="'+k+'" aria-pressed="'+S.cats.has(k)+'"><span class="dot" style="--c:var(--c-'+k+')"></span>'+CATS[k].label+' <span class="n">'+n+'</span></button>';
  }).join("");
  $("fterr").innerHTML=Object.keys(TERR).map(function(k){
    const n=ACTORS.filter(function(a){return a.terr===k;}).length;
    return '<button type="button" class="chip" data-terr="'+k+'" aria-pressed="'+S.terrs.has(k)+'"><span class="shape '+k+'"></span>'+TERR[k]+' <span class="n">'+n+'</span></button>';
  }).join("");
}
function renderList(){
  const m=ACTORS.filter(matches);
  $("listn").textContent=m.length+" / "+ACTORS.length;
  $("list").innerHTML=m.length?m.map(function(a){
    const cur=S.sel&&S.sel.kind==="actor"&&S.sel.i===a.i;
    return '<button type="button" class="row" data-actor="'+a.i+'" aria-current="'+cur+'"><span class="dot" style="--c:var(--c-'+a.cat+')"></span><span class="nm">'+esc(a.name)+'</span><span class="meta">'+a.acts.length+' act.</span></button>';
  }).join(""):'<p class="empty">Aucun acteur ne correspond. Retirez un filtre ou modifiez la recherche.</p>';
}
function renderMatrix(){
  const selA=S.sel&&S.sel.kind==="action"?S.sel.i:-1,selP=S.sel&&S.sel.kind==="actor"?S.sel.i:-1;
  let h='<table><thead><tr><th scope="col" class="lbl">Acteur</th>'+ACTIONS.map(function(a){
    return '<th scope="col"><button type="button" class="colb" data-action="'+a.i+'" aria-current="'+(selA===a.i)+'" title="'+esc(a.name)+'">'+a.id+'<small>'+actorsOf(a.i).length+'</small></button></th>';
  }).join("")+'</tr></thead><tbody>';
  let any=false;
  Object.keys(CATS).forEach(function(k){
    const rows=ACTORS.filter(function(a){return a.cat===k&&matches(a);});
    if(!rows.length)return;any=true;
    h+='<tr class="cat"><th colspan="11" scope="colgroup">'+CATS[k].label+' · '+rows.length+'</th></tr>';
    rows.forEach(function(a){
      h+='<tr class="'+(selP===a.i?"on":"")+'"><th scope="row"><button type="button" class="row" data-actor="'+a.i+'"><span class="dot" style="--c:var(--c-'+a.cat+')"></span><span class="nm">'+esc(a.name)+'</span></button></th>'+
        ACTIONS.map(function(x){return '<td class="'+(selA===x.i?"oncol":"")+'">'+(a.acts.indexOf(x.i)>=0?'<i style="--c:var(--c-'+a.cat+')" title="'+esc(a.name)+" · "+x.id+'"></i>':"")+'</td>';}).join("")+'</tr>';
    });
  });
  if(!any)h+='<tr><th colspan="11"><p class="empty">Aucun acteur ne correspond. Retirez un filtre ou modifiez la recherche.</p></th></tr>';
  $("matrix").innerHTML=h+'</tbody></table>';
}

/* ---------- fiche ---------- */
function mailingEmails(){
  const out=[];
  store.mailing.forEach(function(name){(store.contacts[name]||[]).forEach(function(c){if(c.e)out.push(c.e);});});
  return out;
}
function renderPanel(){
  const P=$("panel");let h="";
  $("mailn").textContent=store.mailing.length;
  if(S.mode==="mailing"){
    const mails=mailingEmails();
    h+='<button type="button" class="back" data-back="1">← Retour</button><span class="eyebrow">Mailing list</span><h2>'+store.mailing.length+' acteur'+(store.mailing.length>1?"s":"")+' sélectionné'+(store.mailing.length>1?"s":"")+'</h2>';
    if(!store.mailing.length)h+='<p class="sub">Ouvrez la fiche d\'un acteur et cochez « Inclure dans la mailing list ».</p>';
    else{
      h+='<div class="list">'+store.mailing.map(function(name){
        const a=ACTORS.filter(function(x){return x.name===name;})[0];if(!a)return "";
        const n=(store.contacts[name]||[]).filter(function(c){return c.e;}).length;
        return '<button type="button" class="row" data-actor="'+a.i+'"><span class="dot" style="--c:var(--c-'+a.cat+')"></span><span class="nm">'+esc(a.name)+'</span><span class="meta">'+n+' e-mail'+(n>1?"s":"")+'</span></button>';
      }).join("")+'</div>';
      h+='<div class="group"><label class="lbl" for="mails">Adresses ('+mails.length+')</label><textarea class="mails" id="mails" readonly>'+esc(mails.join("; "))+'</textarea>'+
         '<button type="button" class="btn primary" id="copy"'+(mails.length?"":" disabled")+'>Copier les adresses</button>'+
         (mails.length?"":'<p class="sub">Aucun contact avec e-mail pour ces acteurs. Ajoutez des contacts dans leurs fiches.</p>')+'</div>';
    }
  }else if(S.sel&&S.sel.kind==="actor"){
    const a=ACTORS[S.sel.i],cs=store.contacts[a.name]||[];
    const peers={};a.acts.forEach(function(ai){actorsOf(ai).forEach(function(b){if(b!==a)peers[b.i]=(peers[b.i]||0)+1;});});
    const top=Object.keys(peers).map(Number).sort(function(x,y){return peers[y]-peers[x]||x-y;}).slice(0,6);
    h+='<span class="eyebrow" style="--c:var(--c-'+a.cat+')"><span class="dot"></span>'+CATS[a.cat].one+'</span><h2>'+esc(a.name)+'</h2>'+
       '<p class="sub">'+esc(a.role)+' · '+TERR[a.terr]+'</p>';
    h+='<div class="group"><span class="lbl">Actions ('+a.acts.length+')</span>'+a.acts.map(function(i){const x=ACTIONS[i];
       return '<button type="button" class="act" data-action="'+i+'"><code>'+x.id+'</code><span>'+esc(x.name)+'</span><small>'+x.per+'</small></button>';}).join("")+'</div>';
    h+='<div class="group"><span class="lbl">Contacts ('+cs.length+')</span>'+
       (cs.length?cs.map(function(c,k){return '<div class="contact"><div><b>'+esc(c.n)+'</b>'+(c.f?'<span>'+esc(c.f)+'</span>':"")+(c.e?'<span>'+esc(c.e)+'</span>':"")+(c.t?'<span>'+esc(c.t)+'</span>':"")+'</div><button type="button" class="x" data-del="'+k+'" aria-label="Supprimer '+esc(c.n)+'">✕</button></div>';}).join(""):'<p class="sub">Aucun contact renseigné.</p>')+
       '<form id="cform"><input id="c-n" placeholder="Nom *" required aria-label="Nom"><input id="c-f" placeholder="Fonction" aria-label="Fonction"><input id="c-e" type="email" placeholder="E-mail" aria-label="E-mail"><input id="c-t" placeholder="Téléphone" aria-label="Téléphone"><button class="btn primary" type="submit">Ajouter le contact</button></form></div>';
    h+='<label class="check"><input type="checkbox" id="inmail"'+(store.mailing.indexOf(a.name)>=0?" checked":"")+'>Inclure dans la mailing list</label>';
    if(top.length)h+='<div class="group"><span class="lbl">Travaille sur les mêmes actions</span><div class="list">'+top.map(function(i){const b=ACTORS[i];
       return '<button type="button" class="row" data-actor="'+i+'"><span class="dot" style="--c:var(--c-'+b.cat+')"></span><span class="nm">'+esc(b.name)+'</span><span class="meta">'+peers[i]+' en commun</span></button>';}).join("")+'</div></div>';
  }else if(S.sel&&S.sel.kind==="action"){
    const x=ACTIONS[S.sel.i],as=actorsOf(x.i);
    h+='<span class="eyebrow">Action · '+x.per+'</span><h2>'+x.id+' · '+esc(x.name)+'</h2><p class="sub">'+as.length+' acteur'+(as.length>1?"s":"")+' mobilisé'+(as.length>1?"s":"")+'</p>';
    Object.keys(CATS).forEach(function(k){
      const g=as.filter(function(a){return a.cat===k;});if(!g.length)return;
      h+='<div class="group"><span class="lbl">'+CATS[k].label+' ('+g.length+')</span><div class="list">'+g.map(function(a){
        return '<button type="button" class="row" data-actor="'+a.i+'"><span class="dot" style="--c:var(--c-'+a.cat+')"></span><span class="nm">'+esc(a.name)+'</span><span class="meta">'+esc(TERR[a.terr]==="National"?"Nat.":a.terr==="corse"?"Corse":"PACA")+'</span></button>';}).join("")+'</div></div>';
    });
  }else{
    const max=Math.max.apply(null,ACTIONS.map(function(x){return actorsOf(x.i).length;}));
    const nc=Object.keys(store.contacts).reduce(function(s,k){return s+store.contacts[k].length;},0);
    h+='<span class="eyebrow">Vue d\'ensemble</span><h2>Qui travaille sur quoi</h2>'+
       '<div class="stats"><div class="stat"><b>'+ACTORS.length+'</b><span>acteurs</span></div><div class="stat"><b>'+ACTIONS.length+'</b><span>actions</span></div><div class="stat"><b>'+nc+'</b><span>contact'+(nc>1?"s":"")+'</span></div></div>'+
       '<div class="group"><span class="lbl">Acteurs mobilisés par action</span>'+ACTIONS.map(function(x){const n=actorsOf(x.i).length;
         return '<button type="button" class="bar" data-action="'+x.i+'" title="'+esc(x.name)+'"><code>'+x.id+'</code><span class="track"><span class="fill" style="width:'+(n/max*100)+'%"></span></span><span class="v">'+n+'</span></button>';}).join("")+'</div>'+
       '<p class="sub">Chaque étage de la constellation regroupe un type d\'acteur. Au centre, les 10 actions. Un trait relie un acteur à chaque action qu\'il porte. La taille du point suit le nombre d\'actions.</p>';
  }
  h+='<p class="note">Prototype autonome. Les contacts et la mailing list saisis ici restent dans ce navigateur et ne sont pas enregistrés dans MedBoard.</p>';
  P.innerHTML=h;
}
function renderAll(){renderList();renderPanel();if(S.view==="mx")renderMatrix();}
function setView(v){
  S.view=v;const mx=v==="mx";
  $("v3d").setAttribute("aria-pressed",!mx);$("vmx").setAttribute("aria-pressed",mx);
  $("matrix").hidden=!mx;cv.hidden=mx;$("hud").hidden=mx;$("legend").hidden=mx;$("hint").hidden=mx;tip.hidden=true;
  if(mx)renderMatrix();
  const h=mx?"#matrice":"#constellation";if(location.hash!==h){try{history.replaceState(null,"",h);}catch(e){}}
}

/* ---------- écouteurs ---------- */
document.addEventListener("click",function(e){
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.actor!==undefined)select({kind:"actor",i:+t.dataset.actor});
  else if(t.dataset.action!==undefined)select({kind:"action",i:+t.dataset.action});
  else if(t.dataset.cat){S.cats.has(t.dataset.cat)?S.cats.delete(t.dataset.cat):S.cats.add(t.dataset.cat);renderFilters();renderAll();}
  else if(t.dataset.terr){S.terrs.has(t.dataset.terr)?S.terrs.delete(t.dataset.terr):S.terrs.add(t.dataset.terr);renderFilters();renderAll();}
  else if(t.dataset.back){S.mode="fiche";renderPanel();}
  else if(t.dataset.del!==undefined&&S.sel){const a=ACTORS[S.sel.i];store.contacts[a.name].splice(+t.dataset.del,1);persist();renderPanel();}
  else if(t.id==="copy"){
    const txt=mailingEmails().join("; ");
    const done=function(ok){t.textContent=ok?"Adresses copiées":"Copie refusée : sélectionnez le texte ci-dessus";};
    try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
  }
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="cform")return;e.preventDefault();
  const a=ACTORS[S.sel.i],n=$("c-n").value.trim();if(!n)return;
  (store.contacts[a.name]=store.contacts[a.name]||[]).push({n:n,f:$("c-f").value.trim(),e:$("c-e").value.trim(),t:$("c-t").value.trim()});
  persist();renderPanel();
});
document.addEventListener("change",function(e){
  if(e.target.id!=="inmail"||!S.sel)return;
  const name=ACTORS[S.sel.i].name,k=store.mailing.indexOf(name);
  if(e.target.checked&&k<0)store.mailing.push(name);else if(!e.target.checked&&k>=0)store.mailing.splice(k,1);
  persist();$("mailn").textContent=store.mailing.length;
});
$("q").addEventListener("input",function(){S.q=this.value.trim();renderAll();});
$("v3d").onclick=function(){setView("3d");if(mobile())closeDrawer();};
$("vmx").onclick=function(){setView("mx");if(mobile())closeDrawer();};
$("mailbtn").onclick=function(){S.mode="mailing";renderPanel();if(mobile())openSheet();};
window.addEventListener("hashchange",function(){setView(location.hash==="#matrice"?"mx":"3d");});

/* ---------- commandes mobiles ---------- */
$("menubtn").addEventListener("click",openDrawer);
$("openpanel").addEventListener("click",openSheet);
$("backdrop").addEventListener("click",closeAll);
/* fermer le tiroir après un tap sur une ligne de l'annuaire */
$("list").addEventListener("click",function(){if(mobile())setTimeout(closeDrawer,10);});
/* swipe de la fiche vers le bas pour fermer */
(function(){
  const p=$("panel");let s=null;
  p.addEventListener("touchstart",function(e){
    if(e.target.closest("input,textarea,button,a"))return;
    if(p.scrollTop>0)return;
    s={y:e.touches[0].clientY,moved:0};
  },{passive:true});
  p.addEventListener("touchmove",function(e){
    if(!s)return;
    const dy=e.touches[0].clientY-s.y;s.moved=dy;
    if(dy>0)p.style.transform="translateY("+dy+"px)";
  },{passive:true});
  p.addEventListener("touchend",function(){
    if(!s)return;const dy=s.moved;s=null;p.style.transform="";
    if(dy>100)closeSheet();
  });
})();

renderFilters();
setView(location.hash==="#matrice"?"mx":(location.hash==="#constellation"?"3d":S.view));
renderAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
requestAnimationFrame(frame);
})();
</script>
</body>
